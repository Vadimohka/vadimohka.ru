name: Deploy static content to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Validate and build the complete site inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-validation.txt

      - name: Install validation dependencies
        run: python3 -m pip install -r scripts/requirements-validation.txt

      - name: Validate source pages and generated discovery artifacts
        run: bash scripts/validate-seo.sh

      - name: Test discovery and delivery regressions
        run: |
          python3 scripts/test-discovery.py
          python3 scripts/test-discovery-client.py
          python3 scripts/test-delivery.py

      - name: Build allowlisted static files and inventory
        id: build
        run: python3 scripts/build-site.py --output dist --inventory _dist/inventory.json

      - name: Exercise discovery from the built homepage
        run: python3 scripts/check-discovery-client.py --serve-dir dist --report _dist/discovery-trace.json

      - name: Upload build snapshot and verification inventory
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-debug
          path: |
            dist/
            _dist/inventory.json
            _dist/discovery-trace.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Set up Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      # v3 archives .well-known and .nojekyll; only .git/.github are excluded.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify all published resources against the build
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the deployed source revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-validation.txt

      - name: Install validation dependencies
        run: python3 -m pip install -r scripts/requirements-validation.txt

      - name: Download the build snapshot
        uses: actions/download-artifact@v4
        with:
          name: site-dist-debug
          path: _live/snapshot

      # Check the canonical domain: an alternate Pages hostname must not hide
      # a broken custom-domain deployment.
      - name: Check canonical live URLs, schema, MIME and every digest
        run: >-
          python3 scripts/check-live-discovery.py
          --inventory _live/snapshot/_dist/inventory.json
          --artifact-dir _live/snapshot/dist
          --deadline 300
          --request-timeout 15
          --connect-timeout 5
          --retry-interval 5
          --report _live/delivery-report.json

      - name: Exercise discovery on the canonical live site
        run: >-
          python3 scripts/check-discovery-client.py
          --base-url https://vadimohka.ru/
          --report _live/discovery-trace.json

      - name: Save delivery verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-live-verification
          path: |
            _live/delivery-report.json
            _live/discovery-trace.json
          if-no-files-found: warn
          retention-days: 7
