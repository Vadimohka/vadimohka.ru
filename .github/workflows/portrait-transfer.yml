name: Prepare approved site update
on:
  push:
    branches: ["maintenance/approved-portrait-20261006"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify candidate tree without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/build-approved-release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-site-candidate
          path: /tmp/approved-site-release
          if-no-files-found: error
          retention-days: 1
